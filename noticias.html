<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notícias — CYSCOMP</title>
<meta name="description" content="Parcerias, eventos, formação e regulação: o que está a acontecer na CYSCOMP e na cibersegurança em Angola.">
<meta name="theme-color" content="#07050d">
<meta name="google" content="notranslate">
<link rel="icon" href="assets/img/brand/cyscomp-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="noticias">
<div id="site-header"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/layout.js"></script>
<canvas id="ambient" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main id="news-root"></main>
<div id="site-footer"></div>

<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/js/ambient.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  const root = document.getElementById('news-root');
  const list = [...CYS.noticias].sort((a, b) => b.data.localeCompare(a.data));
  const id = new URLSearchParams(location.search).get('n');
  const n = id && CYS.noticias.find((x) => x.id === id);

  if (n) {
    document.title = `${n.titulo} — CYSCOMP`;
    const more = list.filter((x) => x.id !== n.id).slice(0, 3);
    root.innerHTML = `
      <header class="page-hero" style="padding-bottom:40px">
        <div class="wrap article">
          <div class="crumbs"><a href="index.html">Início</a> / <a href="noticias.html">Notícias</a> / ${n.tag}</div>
          <p class="eyebrow"><span class="dot"></span>${n.tag} · ${CYS.fmtData(n.data)}</p>
          <h1 style="font-size:clamp(34px,4.4vw,60px)">${n.titulo}</h1>
          <p>${n.resumo}</p>
        </div>
      </header>
      <section class="section" style="padding-top:20px">
        <div class="wrap">
          <article class="article">
            ${n.video
              ? `<div class="article__video reveal"><video src="${n.video}" poster="assets/video/dfir.jpg" controls playsinline preload="none"></video></div>`
              : `<div class="article__cover reveal"><img src="${n.img}" alt=""></div>`}
            <div class="article__body">${n.corpo.map((p) => `<p class="reveal">${p}</p>`).join('')}</div>
            <div class="reveal" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:36px">
              <a class="btn btn--light" href="index.html#contacto">Falar com a CYSCOMP <span class="btn__arrow">→</span></a>
              <a class="btn btn--ghost" href="inscricao.html">Inscrição online</a>
            </div>
          </article>
          <div class="article__more">
            <div class="logos-sub"><h3>Mais notícias</h3><a class="link" href="noticias.html">Ver todas →</a></div>
            <div class="news">${more.map((x) => CYS.postCard(x)).join('')}</div>
          </div>
        </div>
      </section>`;
    CYS.reveal(root);
  } else {
    const tags = ['Todas', ...new Set(list.map((x) => x.tag))];
    root.innerHTML = `
      <header class="page-hero">
        <div class="page-hero__photo"><img src="assets/img/photos/reuniao.jpg" alt=""></div>
        <div class="wrap">
          <div class="crumbs"><a href="index.html">Início</a> / Notícias</div>
          <p class="eyebrow"><span class="dot"></span>Notícias e eventos</p>
          <h1>O que está <em>a acontecer.</em></h1>
          <p>Parcerias, formação, eventos e regulação. A actividade da CYSCOMP e o que muda na cibersegurança em Angola.</p>
        </div>
      </header>
      <section class="section" style="padding-top:20px">
        <div class="wrap">
          <div class="filters" role="group" aria-label="Filtrar por tema">${tags.map((t, i) => `<button aria-pressed="${i === 0}" data-t="${t}">${t}</button>`).join('')}</div>
          <div class="news" id="list"></div>
        </div>
      </section>`;
    const box = document.getElementById('list');
    const render = (t) => {
      const items = list.filter((x) => t === 'Todas' || x.tag === t);
      box.innerHTML = items.map((x, i) => CYS.postCard(x, i === 0 && t === 'Todas')).join('');
      CYS.reveal(box);
    };
    root.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
      root.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      render(b.dataset.t);
    }));
    render('Todas');
  }
})();
</script>
</body>
</html>
